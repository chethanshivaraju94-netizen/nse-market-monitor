name: Daily NSE Market Monitor

on:
  schedule:
    # Runs at 10:45 UTC (4:15 PM IST) every Monday through Friday
    - cron: '45 10 * * 1-5'
  workflow_dispatch: # Allows you to manually trigger a run

permissions:
  contents: write # Required to save the updated Excel file

jobs:
  update-monitor:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas openpyxl

    - name: Run Market Monitor Script
      run: python MM.py

    - name: Commit and Push Updated Excel File
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add NSE_Market_Monitor.xlsx
        # Only commit if changes exist
        git diff-index --quiet HEAD || git commit -m "Automated daily update: $(date +'%Y-%m-%d')"
        git push

    - name: Upload Excel to Google Drive
      run: |
        # Install rclone
        curl https://rclone.org/install.sh | sudo bash
        
        # Create rclone config
        mkdir -p ~/.config/rclone
        echo "[gdrive]" > ~/.config/rclone/rclone.conf
        echo "type = drive" >> ~/.config/rclone/rclone.conf
        echo "scope = drive" >> ~/.config/rclone/rclone.conf
        echo "service_account_file = sa.json" >> ~/.config/rclone/rclone.conf
        
        # THE FIX: Tell rclone exactly which folder is the absolute root
        echo "root_folder_id = ${{ secrets.GDRIVE_FOLDER_ID }}" >> ~/.config/rclone/rclone.conf
        
        # Write the secret to sa.json using a heredoc
        cat <<EOF > sa.json
        ${{ secrets.GDRIVE_CREDENTIALS }}
        EOF
        
        # Sync the file to the configured root (Notice it is just gdrive: now)
        rclone copy NSE_Market_Monitor.xlsx gdrive:
