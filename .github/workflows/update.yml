name: Daily NSE Market Monitor

on:
  workflow_dispatch: 

permissions:
  contents: write 

jobs:
  update-monitor:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yfinance pandas openpyxl

    - name: Run Market Monitor Script
      run: python MM.py

    - name: Commit and Push Updated Excel File
      run: |
        # Optional: Change these to your actual name and email if you want the GitHub commits to look like you too!
        git config --global user.name "Chethan"
        git config --global user.email "your.email@gmail.com"
        git add NSE_Market_Monitor.xlsx
        git diff-index --quiet HEAD || git commit -m "Automated daily update: $(date +'%Y-%m-%d')"
        git push

    - name: Upload Excel to Google Drive
      run: |
        curl https://rclone.org/install.sh | sudo bash
        
        # Build the rclone config directory
        mkdir -p ~/.config/rclone
        
        # Write your personal config secret exactly as provided
        cat <<EOF > ~/.config/rclone/rclone.conf
        ${{ secrets.RCLONE_CONFIG_DATA }}
        EOF
        
        # Sync directly to a folder named "MarketMonitor" in your personal Drive
        rclone copy NSE_Market_Monitor.xlsx gdrive:MarketMonitor
