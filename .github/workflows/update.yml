name: Daily NSE Market Monitor

on:
  workflow_dispatch: 

permissions:
  contents: write 

jobs:
  update-monitor:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # yfinance has been successfully eliminated from the stack!
        pip install pandas openpyxl git+https://github.com/rongardF/tvdatafeed.git

    - name: Run Market Monitor Script
      run: python MM.py
      
    - name: Run Sector Monitor Script
      run: python Sector_Monitor.py
      
    - name: Commit and Push Updated Excel File
      run: |
        git config --global user.name "Chethan"
        git config --global user.email "your.email@gmail.com"
        git add *.xlsx
        git diff-index --quiet HEAD || git commit -m "Automated daily update: $(date +'%Y-%m-%d')"
        git push

    - name: Upload Excel to Google Drive
      run: |
        curl https://rclone.org/install.sh | sudo bash
        
        # Build the rclone config directory
        mkdir -p ~/.config/rclone
        
        # Write your personal config secret exactly as provided
        cat <<EOF > ~/.config/rclone/rclone.conf
        ${{ secrets.RCLONE_CONFIG_DATA }}
        EOF
        
        # Sync BOTH Excel files simultaneously to your MarketMonitor folder
        rclone copy . gdrive:MarketMonitor --include "*.xlsx"
